manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: kkrishnan90/gemini-live-adk
    source: https://github.com/kkrishnan90/gemini-live-adk
    branch: main
    commit: "e39fdb53"
    scope: [backend/agents.py, backend/config.py, backend/session_manager.py, backend/subagents.py, backend/tools.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:56:29Z'
    url: https://a2as.org/certified/agents/kkrishnan90/gemini-live-adk
  signatures:
    digest: sha256:KWUjHVIxy4aTyAZ0YPJJkz_UHLV2KsHPgcb-Mm3w2is
    key: ed25519:h6lE31KnIQBROAXnK4kD1k7NQKQpLgxvRo7ct1h0eVM
    sig: ed25519:a5gKYDHnvamWmSRJy6WrVry158WFu7zvN_zHSyzSD0i5bhiy3Ueod04Jsq7UsCdgr2I3AB_lX9bZSmhRGundAg

agents:
  flight_specialist:
    type: instance
    models: [gemini-2.5-flash]
    tools: [check_flight_availability]
    params:
      name: flight_specialist
      instruction: [You are a flight specialist agent., 'You handle all flight-related queries including availability, prices,
          and airlines.', Use your flight database to provide accurate information., Keep responses concise and focused on
          flight information., Format your responses with clear flight details.]
  lifestyle_specialist:
    type: instance
    models: [gemini-2.5-flash]
    tools: [google_search]
    params:
      name: lifestyle_specialist
      instruction: [You are a lifestyle and travel research specialist., 'You handle queries about destinations, events, weather,
          and local activities.', Use the google_search tool to find current information., Keep responses concise and informative.,
        Focus on practical travel information.]
  nomad_agent:
    type: instance
    models: [gemini-live-2.5-flash-native-audio]
    tools: [consult_flight_specialist, consult_lifestyle_specialist]
    params:
      name: Nomad
      instruction: ['You are Nomad, a collaborative travel assistant who orchestrates a team of specialist agents.', 'Your
          team includes:', '1. Flight Specialist - Expert in flight bookings, prices, airlines, and schedules', '2. Lifestyle
          Specialist - Expert in destinations, weather, events, and local activities', 'When users ask questions:', '- For
          flights, prices, or airlines: use consult_flight_specialist tool', '- For destinations, weather, events, or activities:
          use consult_lifestyle_specialist tool', '- You can consult multiple specialists for complex queries', 'Always:',
        '- Acknowledge which specialist you''re consulting', '- Keep your own responses concise and conversational (under
          40 words)', '- Be enthusiastic and helpful', '- Synthesize information from specialists naturally', 'Example interactions:',
        '- User: "I want to go to Japan"', 'You: "Let me consult my Flight Specialist about Japan flights for you!"', '- User:
          "What''s the weather like in Tokyo?"', 'You: "I''ll check with my Lifestyle Specialist about Tokyo weather!"', 'IMPORTANT:',
        '- When using a tool, do NOT say "Let me check with..." or "I''ll ask...".', '- Just call the tool silently.', '-
          When the specialist returns information, IMMEDIATELY answer the user''s question with that information.', '- Do
          NOT wait for the user to ask again.']

models:
  gemini-2.5-flash:
    type: literal
    agents: [flight_specialist, lifestyle_specialist]
  gemini-live-2.5-flash-native-audio:
    type: literal
    agents: [nomad_agent]

tools:
  check_flight_availability:
    type: function
    agents: [flight_specialist]
    params:
      description: Check flight availability and prices.
  consult_flight_specialist:
    type: function
    agents: [nomad_agent]
    params:
      description: |-
        Consults the Flight Specialist subagent for flight information.
        This is a wrapper tool for the Live API to delegate to the Flight Specialist subagent.

        Args:
            destination: The destination city or airport.
            date: The travel date (can be descriptive like "May" or specific like "2024-05-20").

        Returns:
            The Flight Specialist's response with flight information.
  consult_lifestyle_specialist:
    type: function
    agents: [nomad_agent]
    params:
      description: Consults the Lifestyle Specialist for destination/weather info.
  google_search:
    type: module
    agents: [lifestyle_specialist]

imports:
  Any: typing.Any
  asyncio: asyncio
  check_flight_availability: subagents.check_flight_availability
  config: config
  consult_flight_specialist: tools.consult_flight_specialist
  consult_lifestyle_specialist: tools.consult_lifestyle_specialist
  CORSMiddleware: fastapi.middleware.cors.CORSMiddleware
  Dict: typing.Dict
  FastAPI: fastapi.FastAPI
  flight_specialist: subagents.flight_specialist
  google_search: google.adk.tools.google_search
  InMemoryRunner: google.adk.runners.InMemoryRunner
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  lifestyle_specialist: subagents.lifestyle_specialist
  LiveRequestQueue: google.adk.agents.LiveRequestQueue
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  log_queue: logger.log_queue
  log_tool_complete: logger.log_tool_complete
  log_tool_start: logger.log_tool_start
  nomad_agent: agents.nomad_agent
  Optional: typing.Optional
  os: os
  RunConfig: google.adk.agents.run_config.RunConfig
  SessionManager: session_manager.SessionManager
  StreamingMode: google.adk.agents.run_config.StreamingMode
  sys: sys
  ThreadPoolExecutor: concurrent.futures.ThreadPoolExecutor
  time: time
  traceback: traceback
  types: google.genai.types
  uvicorn: uvicorn
  WebSocket: fastapi.WebSocket
  WebSocketDisconnect: fastapi.WebSocketDisconnect

functions:
  __init__:
    type: sync
    module: backend.session_manager
    args: [self, websocket]
  _run:
    type: async
    module: backend.tools
  _run_subagent_sync:
    type: sync
    module: backend.tools
    args: [agent, query, app_name]
    params:
      returns: str
  check_flight_availability:
    type: sync
    module: backend.subagents
    args: [destination, date]
    params:
      returns: dict
  consult_flight_specialist:
    type: async
    module: backend.tools
    args: [destination, date]
    params:
      returns: str
  consult_flight_specialist_fallback:
    type: sync
    module: backend.tools
    args: [destination, date]
    params:
      returns: Dict
  consult_lifestyle_specialist:
    type: async
    module: backend.tools
    args: [query]
    params:
      returns: str
  handle_content:
    type: async
    module: backend.session_manager
    args: [self, content]
  handle_server_content:
    type: async
    module: backend.session_manager
    args: [self, server_content, is_partial]
  handle_tool_call:
    type: async
    module: backend.session_manager
    args: [self, tool_call]
  handle_tool_call_from_function:
    type: async
    module: backend.session_manager
    args: [self, fc]
  handle_tool_response:
    type: async
    module: backend.session_manager
    args: [self, tool_response]
  log_tool_complete:
    type: sync
    module: backend.logger
    args: [tool_name, result, duration]
  log_tool_start:
    type: sync
    module: backend.logger
    args: [tool_name, args]
  process_event:
    type: async
    module: backend.session_manager
    args: [self, event]
  receive_from_client:
    type: async
    module: backend.session_manager
    args: [self]
  start:
    type: async
    module: backend.session_manager
    args: [self]
  stream_logs:
    type: async
    module: backend.session_manager
    args: [self]
  websocket_endpoint:
    type: async
    module: backend.app
    args: [websocket]
